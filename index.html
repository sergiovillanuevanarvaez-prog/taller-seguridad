<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Control - CESBA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #111c32;
      box-shadow: 0 20px 60px #0005;
    }

    h1 { color: #10b981; margin-top: 0; }
    p { color: #cbd5e1; line-height: 1.6; }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    label { color: #94a3b8; }

    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }

    button {
      border: 0;
      background: #10b981;
      color: #06281e;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #0f172a;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🚀 Enlace al Edge</h1>
    <p>
      Centro de Control CESBA. Ingresa tu matrícula oficial
      para validar tu identidad.
    </p>

    <form id="formulario">
      <label for="matricula">Matrícula oficial CESBA:</label>

      <input
        id="matricula"
        name="matricula"
        type="text"
        placeholder="Ej. 123456"
        maxlength="30"
        required
      >

      <button id="boton" type="submit">
        Autenticar y desplegar
      </button>
    </form>

    <div id="resultado" role="status" aria-live="polite"></div>
  </main>

  <script>
    const WORKER_URL =
      "https://TU-WORKER.TU-USUARIO.workers.dev";

    const formulario = document.getElementById("formulario");
    const boton = document.getElementById("boton");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      const matricula =
        document.getElementById("matricula").value.trim();

      resultado.style.display = "block";
      resultado.textContent = "Validando matrícula...";
      boton.disabled = true;

      try {
        const respuesta = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ matricula })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(datos.mensaje || datos.error ||
            "No se pudo validar la matrícula.");
        }

        resultado.textContent =
          "✅ " + (datos.mensaje ||
          ("Identidad confirmada: " + (datos.nombre || "")));

      } catch (error) {
        resultado.textContent =
          "❌ " + error.message +
          " Verifica la URL del Worker y su configuración.";
      } finally {
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
